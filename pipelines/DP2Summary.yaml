description: |
  Tier1 plots and metrics to assess the data quality across the whole sky
tasks:
  makeMetricTableObjectTableCore:
    class: lsst.analysis.tools.tasks.MakeMetricTableTask
    config:
      connections.metricBundleName: "object_metrics"
      connections.outputTableName: "object_metrics_table"
  objectTableCoreWholeSkyPlot:
    class: lsst.analysis.tools.tasks.WholeSkyAnalysisTask
    config:
      connections.inputName: "object_metrics_table"
      file: $ANALYSIS_TOOLS_DIR/config/objectTableCoreWholeSkyPlot_dp2Pub.py
  makeMetricTableObjectTableCoreRefCatMatchPhotom:
    class: lsst.analysis.tools.tasks.MakeMetricTableTask
    config:
      connections.metricBundleName: "object_ref_match_photom_metrics"
      connections.outputTableName: "object_ref_match_photom_metrics_table"
  objectTableCoreRefCatMatchPhotomWholeSkyPlot:
    class: lsst.analysis.tools.tasks.WholeSkyAnalysisTask
    config:
      connections.inputName: "object_ref_match_photom_metrics_table"
      connections.outputName: "objectTableCoreRefCatMatchPhotom_wholeSky"
      file: $ANALYSIS_TOOLS_DIR/config/objectTableCoreRefCatMatchPhotomWholeSkyPlot_dp2Pub.py
      python: |
        from lsst.analysis.tools.atools import *
  makeMetricTableObjectTableCoreRefCatMatch:
    class: lsst.analysis.tools.tasks.MakeMetricTableTask
    config:
      connections.metricBundleName: "object_ref_match_astrom_metrics"
      connections.outputTableName: "object_ref_match_astrom_metrics_table"
  objectTableCoreRefCatMatchWholeSkyPlot:
    class: lsst.analysis.tools.tasks.WholeSkyAnalysisTask
    config:
      connections.inputName: "object_ref_match_astrom_metrics_table"
      connections.outputName: "objectTableCoreRefCatMatchAstrom_wholeSky"
      file: $ANALYSIS_TOOLS_DIR/config/objectTableCoreRefCatMatchWholeSkyPlot_dp2Pub.py
      python: |
        from lsst.analysis.tools.atools import *
